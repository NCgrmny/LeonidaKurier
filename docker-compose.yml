services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: https://leonidakurier.de
      NEXT_PUBLIC_COMPASS_HOST: leonidakompass.de
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
